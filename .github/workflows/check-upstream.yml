name: 检测上游内核更新并触发编译

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆 immortalwrt 上游仓库
        run: |
          git clone --depth 1 --branch master \
            https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt
          cd /tmp/immortalwrt
          echo "上游最新提交: $(git log -1 --format='%h %s')"
          echo "=== include 目录下的内核版本文件 ==="
          ls -la include/kernel-* 2>/dev/null || echo "未找到 kernel-* 文件"

      - name: 检测内核 6.12.x 版本
        id: detect
        run: |
          cd /tmp/immortalwrt
          KERNEL_VER=""

          # 优先从 include/kernel-6.12 读取（OpenWrt/ImmortalWrt 标准位置）
          if [ -f include/kernel-6.12 ]; then
            echo "=== include/kernel-6.12 内容 ==="
            cat include/kernel-6.12
            # 兼容两种写法：LINUX_VERSION-6.12 = .134 或 LINUX_VERSION-6.12 = 6.12.134
            PATCH=$(grep -E '^LINUX_VERSION-6\.12' include/kernel-6.12 | head -1 | grep -oE '[0-9.]+$')
            if [ -n "$PATCH" ]; then
              case "$PATCH" in
                .*) KERNEL_VER="6.12${PATCH}" ;;
                *)  KERNEL_VER="$PATCH" ;;
              esac
            fi
          fi

          # 兜底：遍历所有 kernel-* 文件查找 6.12
          if [ -z "$KERNEL_VER" ]; then
            for f in include/kernel-*; do
              if grep -q 'LINUX_VERSION-6\.12' "$f" 2>/dev/null; then
                PATCH=$(grep -E '^LINUX_VERSION-6\.12' "$f" | head -1 | grep -oE '[0-9.]+$')
                if [ -n "$PATCH" ]; then
                  case "$PATCH" in
                    .*) KERNEL_VER="6.12${PATCH}" ;;
                    *)  KERNEL_VER="$PATCH" ;;
                  esac
                  echo "从 $f 中找到版本: $KERNEL_VER"
                  break
                fi
              fi
            done
          fi

          # 最终结果
          if [ -z "$KERNEL_VER" ]; then
            echo "未检测到 6.12 内核版本"
            echo "kernel_version=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "检测到内核版本: $KERNEL_VER"
          echo "kernel_version=$KERNEL_VER" >> $GITHUB_OUTPUT

      - name: 检查该内核版本是否已构建过
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KERNEL_VER="${{ steps.detect.outputs.kernel_version }}"
          if [ "$KERNEL_VER" = "unknown" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TAG="kernel-$KERNEL_VER"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "内核 $KERNEL_VER 已构建过（Release: $TAG），跳过"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "内核 $KERNEL_VER 有更新，需要重新编译固件"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 触发现有编译工作流
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KERNEL_VER="${{ steps.detect.outputs.kernel_version }}"
          echo "触发构建: 内核 $KERNEL_VER"
          # ✅ 已改为你的实际工作流文件名 build.yml
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f kernel_version="$KERNEL_VER"
